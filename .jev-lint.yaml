# jev-lint configuration. A flag of the same name overrides a setting here,
# so a project can commit this and still let someone change one thing for one
# run. A commented setting takes the built-in default shown after it.

# What `jev-lint check` looks at with no path given, and what under those
# paths it never judges: fixtures with planted defects, vendored code.
# exclude: [src/fixtures, '**/*.gen.ts']   # paths, or globs

# The rules that run: `on`, `off`, a severity (hint, info, warning, error),
# or a mapping -- `{ severity: error, threshold: 0.7 }`. Write `lang/id` to
# select one language's rule. A bare shipped id selects every language that
# has it and warns. Every shipped rule is listed here, on; remove or turn off the
# ones you do not want. Their cutoffs were fitted to this package's corpus,
# not to your
# code: https://github.com/mizchi/jev-lint#calibrating
#
# A rule of your own goes in .jev-lint/rules/ (a rule.yml, or the shipped
# layout <language>/<id>/rule.yml with fixtures beside it) and is named here
# like any other.
rules:
  git/commit-message-describes-diff: on
  git/diff-follows-instructions: on
  go/fn-name-promises: on
  go/idempotent-name: on
  go/module-name-describes-contents: on
  go/must-name-panics: on
  go/pure-name-is-pure: on
  go/safe-name-is-safe: on
  go/test-name-verifies-claim: on
  go/tests-cover-failure-paths: on
  go/var-name-describes-value: on
  javascript/comment-describes-declaration: on
  json/script-name-does: on
  markdown/agent-instruction-is-unclear: on
  markdown/agent-instructions-conflict: on
  markdown/document-abandons-a-question: on
  markdown/document-is-filler: on
  markdown/document-is-formulaic: on
  markdown/document-is-generic: on
  markdown/document-is-incoherent: on
  markdown/document-is-padded: on
  markdown/document-is-slop: on
  markdown/document-is-vague: on
  markdown/document-lacks-firsthand-evidence: on
  markdown/section-ends-with-a-preview: on
  markdown/section-opens-with-an-agenda: on
  moonbit/catch-hides-failure: on
  moonbit/comment-describes-block: on
  moonbit/comment-describes-declaration: on
  moonbit/doc-errors-match-body: on
  moonbit/error-message-matches-condition: on
  moonbit/fn-name-promises: on
  moonbit/idempotent-name: on
  moonbit/log-level-matches-event: on
  moonbit/log-message-matches-event: on
  moonbit/module-name-describes-contents: on
  moonbit/module-naming-consistent: on
  moonbit/pure-name-is-pure: on
  moonbit/safe-name-is-safe: on
  moonbit/snapshot-only-behaviour-claim: on
  moonbit/test-name-describes-code: on
  moonbit/test-name-verifies-claim: on
  moonbit/tests-cover-failure-paths: on
  moonbit/trait-name-describes-methods: on
  moonbit/type-name-describes-shape: on
  moonbit/var-name-describes-value: on
  python/class-shape-shows-its-role: on
  python/comment-describes-block: on
  python/comment-describes-declaration: on
  python/doc-errors-match-body: on
  python/fn-name-promises: on
  python/idempotent-name: on
  python/log-level-matches-event: on
  python/method-name-promises: on
  python/module-name-describes-contents: on
  python/pure-name-is-pure: on
  python/safe-name-is-safe: on
  python/test-name-describes-code: on
  python/tests-cover-failure-paths: on
  python/var-name-describes-value: on
  rust/comment-describes-block: on
  rust/comment-describes-declaration: on
  rust/doc-errors-match-body: on
  rust/fn-name-promises: on
  rust/module-name-describes-contents: on
  rust/test-name-describes-code: on
  rust/test-name-verifies-claim: on
